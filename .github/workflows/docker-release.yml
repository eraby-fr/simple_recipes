name: Build & Push Docker image (release)

on:
  push:
    branches:
      - 'release/**'

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write       # nécessaire pour pousser vers ghcr.io

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Extrait la version depuis le nom de la branche : release/1.2.3 → 1.2.3
      - name: Extraire la version
        id: vars
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # Le nom d'image doit être en minuscules pour ghcr.io
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token fourni automatiquement

      # Active BuildKit (cache, multi-platform…)
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.VERSION }}
            ${{ steps.vars.outputs.IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
