name: Build & Push Docker image (release)

on:
  push:
    branches:
      - 'release/**'

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write       # required to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extract version from branch name: release/1.2.3 → 1.2.3
      - name: Extract version
        id: vars
        env:
          # Passed through the environment rather than interpolated into the
          # script body, which would allow shell injection via the context.
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # Image name must be lowercase for ghcr.io
          REPO_LC="$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token provided automatically

      # Enable BuildKit (cache, multi-platform…)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.VERSION }}
            ${{ steps.vars.outputs.IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
