{% extends "base.html" %}

{% block title %}Inscription — Simple Recipes{% endblock %}

{% block main %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="auth-icon" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      <h1>Créer un compte</h1>
    </div>

    {% if error %}
    <div class="alert alert-error" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form action="/register" method="post" class="auth-form">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          minlength="3"
          maxlength="32"
          autocomplete="username"
          placeholder="Entre 3 et 32 caractères"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
          autocomplete="new-password"
          placeholder="Au moins 8 caractères"
        >
      </div>

      <button type="submit" class="btn-primary btn-full">
        Créer mon compte
      </button>
    </form>

    <p class="auth-link">
      Déjà un compte ? <a href="/login">Se connecter</a>
    </p>
  </div>
</div>
{% endblock %}
