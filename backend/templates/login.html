{% extends "base.html" %}

{% block title %}Connexion — Simple Recipes{% endblock %}

{% block main %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="auth-icon" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <h1>Connexion</h1>
    </div>

    {% if error %}
    <div class="alert alert-error" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="post" class="auth-form">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          autocomplete="username"
          placeholder="Votre nom d'utilisateur"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="Votre mot de passe"
        >
      </div>

      <button type="submit" class="btn-primary btn-full">
        Se connecter
      </button>
    </form>

    <p class="auth-link">
      Pas encore de compte ? <a href="/register">Créer un compte</a>
    </p>
  </div>
</div>
{% endblock %}
